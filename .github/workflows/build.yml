name: Build and test
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: apt-get update && apt-get install -y build-essential meson ninja-build valac pkg-config libgtk-4-dev libadwaita-1-dev libgee-0.8-dev libsqlite3-dev libjson-glib-dev libpoppler-glib-dev libarchive-dev libpolkit-gobject-1-dev libx11-dev xvfb xauth dbus
      - run: meson setup build --prefix=/usr
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs
